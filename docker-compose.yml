services:
  rembg-app:
    image: ghcr.io/rnz01/my-rembg-app:latest
    container_name: rembg-app
    ports:
      - "3010:5100"
    restart: always
    environment:
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASS=strong_pass
      - SECRET_KEY=strong_sec
      - LOG_LEVEL=INFO  # Logging level (DEBUG/INFO/WARNING/ERROR)
      - FLASK_ENV=production # Environment mode (development/production)
      - FLASK_DEBUG=False # Debug mode (True/False)
    volumes:
      - ./logs:/app/logs  # Persist logs to host