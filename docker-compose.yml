services:
  rembg-app:
    image: ghcr.io/rnz01/my-rembg-app:latest
    container_name: rembg-app
    ports:
      - "3010:5100"
    restart: always
    environment:
      - BASIC_AUTH_USER=${BASIC_AUTH_USER}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
    volumes:
      - rembg_logs:/app/logs  # Persist logs using named volume

volumes:
  rembg_logs:
